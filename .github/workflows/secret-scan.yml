name: Secret Scan

# Backstop secret scanning - runs server-side on GitHub's runners, so unlike
# the local .githooks/pre-push hook it cannot be bypassed by a contributor
# (no --no-verify, no missing local setup). Combine with a required
# branch-protection status check on protected branches for real enforcement.

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_history:
        description: 'Scan the entire repo history instead of just the latest commits'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history locally so the commit range below can be resolved

      - name: Determine commit range to scan
        id: range
        shell: bash
        env:
          FULL_HISTORY: ${{ inputs.full_history || false }}
          PUSH_COMMITS: ${{ toJSON(github.event.commits) }}
        run: |
          if [ "$FULL_HISTORY" = "true" ]; then
            echo "range=" >> "$GITHUB_OUTPUT"
            echo "Resolved scan range: <full history>"
            exit 0
          fi

          ZERO_SHA="0000000000000000000000000000000000000000"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.sha }}"
            if [ "$BEFORE" = "$ZERO_SHA" ] || [ -z "$BEFORE" ]; then
              # New branch: scan only the commits included in this push.
              N="$( { printf '%s' "${PUSH_COMMITS:-[]}" | grep -o '"id"' || true; } | wc -l | tr -d ' ')"
              if [ -z "$N" ] || [ "$N" -lt 1 ]; then
                N=1
              fi
              RANGE="-$N"
            else
              RANGE="$BEFORE..$AFTER"
            fi
          fi

          echo "range=$RANGE" >> "$GITHUB_OUTPUT"
          echo "Resolved scan range: $RANGE"

      - name: Run gitleaks (free, open-source CLI - no license required)
        shell: bash
        run: |
          LOG_OPTS_ARG=""
          if [ -n "${{ steps.range.outputs.range }}" ]; then
            LOG_OPTS_ARG="--log-opts=${{ steps.range.outputs.range }}"
          fi

          docker run --rm -v "${{ github.workspace }}:/repo" -w /repo \
            zricethezav/gitleaks:v8.30.1 detect --source=/repo \
            $LOG_OPTS_ARG --redact -v
