name: Secret Scan

# Backstop secret scanning - runs server-side on GitHub's runners, so unlike
# the local .githooks/pre-push hook it cannot be bypassed by a contributor
# (no --no-verify, no missing local setup). Combine with a required
# branch-protection status check on protected branches for real enforcement.
#
# The scanning logic itself lives in the shared, reusable gitleaks-scan
# composite action in getappsh/actions, so every repo in the org calls the
# same action instead of duplicating this workflow - see
# https://github.com/getappsh/actions/blob/main/gitleaks-scan/README.md.

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_history:
        description: 'Scan the entire repo history instead of just the latest commits'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: getappsh/actions/gitleaks-scan@main
        with:
          full-history: ${{ inputs.full_history || false }}
